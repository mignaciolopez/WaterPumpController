; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
framework = arduino

monitor_speed = 115200
#upload_speed = 460800

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=5

lib_deps =
    ESP32Ping
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    bblanchon/ArduinoJson
    ottowinter/ESPAsyncWebServer-esphome    ; HTTP + WebSocket server (brings its own AsyncTCP)
    ; Do NOT list an AsyncTCP library here: a second copy with another version has a different class
    ; layout than the one the server was built with, which corrupts memory at startup.


;
; EXPERIMENT (not for normal use): the same firmware, but the WebSocket never sends anything. Used to find out
; whether sending from the control task causes the heap corruption seen when a WebSocket client disconnects.
; Upload with: pio run -e esp-wrover-kit-nowssend -t upload
[env:esp-wrover-kit-nowssend]
extends = env:esp-wrover-kit
build_flags =
    ${env:esp-wrover-kit.build_flags}
    -DWS_DISABLE_SENDS

; Host-side unit tests for src/core (no hardware). Run: pio test -e native
[env:native]
platform = native
test_framework = googletest
test_build_src = yes
build_src_filter = -<*> +<core/> +<adapters/codec/> +<app/Controller.cpp> +<adapters/sensors/A02YYUW_Frame.cpp>
lib_deps =
    bblanchon/ArduinoJson
build_flags =
    -std=gnu++17
    -Isrc
    -Wall
    -Wextra